apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: careeros-prod
resources:
  - ../base
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/environment: prod
patches:
  - target:
      kind: Deployment
      name: ai-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
