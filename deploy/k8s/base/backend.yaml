apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: careeros
  labels:
    app: backend
    app.kubernetes.io/part-of: ai-career-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/part-of: ai-career-os
    spec:
      containers:
        - name: backend
          image: ghcr.io/xiaodernan/careeros-backend:latest # replace with pinned digest in prod
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: careeros-config
            - secretRef:
                name: careeros-secrets
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: careeros-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: careeros-config
                  key: POSTGRES_PORT
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 2Gi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: careeros
  labels:
    app: backend
    app.kubernetes.io/part-of: ai-career-os
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: careeros
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
