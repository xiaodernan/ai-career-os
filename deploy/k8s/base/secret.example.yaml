# Non-secret example; copy into a real secret in the target cluster.
# Do NOT commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: careeros-secrets
  namespace: careeros
  labels:
    app.kubernetes.io/part-of: ai-career-os
type: Opaque
stringData:
  POSTGRES_USER: career_os
  POSTGRES_PASSWORD: CHANGE_ME_STRONG_POSTGRES_PASSWORD
  POSTGRES_DB: career_os
  REDIS_PASSWORD: CHANGE_ME_STRONG_REDIS_PASSWORD
  MINIO_ROOT_USER: careeros-minio-admin
  MINIO_ROOT_PASSWORD: CHANGE_ME_STRONG_MINIO_PASSWORD
  JWT_SECRET: CHANGE_ME_64_PLUS_RANDOM_CHARS
  INTERNAL_API_TOKEN: CHANGE_ME_STRONG_INTERNAL_TOKEN
  APP_MFA_SECRET: CHANGE_ME_STRONG_MFA_SECRET
  APP_MAIL_LINK_SECRET: CHANGE_ME_STRONG_MAIL_LINK_SECRET
  DATABASE_URL: postgresql://career_os:CHANGE_ME_STRONG_POSTGRES_PASSWORD@postgres:5432/career_os
