apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery
  namespace: careeros
  labels:
    app: discovery
    app.kubernetes.io/part-of: ai-career-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery
  template:
    metadata:
      labels:
        app: discovery
        app.kubernetes.io/part-of: ai-career-os
    spec:
      containers:
        - name: discovery
          image: ghcr.io/xiaodernan/careeros-discovery:latest # replace with pinned digest in prod
          ports:
            - name: http
              containerPort: 8761
          envFrom:
            - configMapRef:
                name: careeros-config
            - secretRef:
                name: careeros-secrets
          env:
            - name: EUREKA_HOSTNAME
              value: discovery
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 1Gi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: discovery
  namespace: careeros
  labels:
    app: discovery
    app.kubernetes.io/part-of: ai-career-os
spec:
  selector:
    app: discovery
  ports:
    - name: http
      port: 8761
      targetPort: http
