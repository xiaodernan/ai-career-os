apiVersion: v1
kind: ConfigMap
metadata:
  name: careeros-config
  namespace: careeros
  labels:
    app.kubernetes.io/part-of: ai-career-os
data:
  APP_ENV: prod
  REDIS_URL: redis://redis:6379/0
  REDIS_TIMEOUT: 500ms
  REDIS_CONNECT_TIMEOUT: 500ms
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: career_os
  MINIO_ENDPOINT: http://minio:9000
  EUREKA_DEFAULT_ZONE: http://discovery:8761/eureka/
  SPRING_PROFILES_ACTIVE: eureka
  BACKEND_HOSTNAME: backend
  GATEWAY_HOSTNAME: gateway
  AI_SERVICE_BASE_URL: http://ai-service:8000
  APP_JWT_COOKIE_SECURE: "true"
  APP_CORS_ORIGINS: https://app.careeros.invalid
