apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: careeros
  labels:
    app: redis
    app.kubernetes.io/part-of: ai-career-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: ai-career-os
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: careeros
  labels:
    app: redis
    app.kubernetes.io/part-of: ai-career-os
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
