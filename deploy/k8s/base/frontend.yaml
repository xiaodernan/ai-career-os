apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: careeros
  labels:
    app: frontend
    app.kubernetes.io/part-of: ai-career-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: ai-career-os
    spec:
      containers:
        - name: frontend
          image: ghcr.io/xiaodernan/careeros-frontend:latest # replace with pinned digest in prod
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: http://gateway:8081/api/v1
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 1Gi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: careeros
  labels:
    app: frontend
    app.kubernetes.io/part-of: ai-career-os
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: careeros
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
