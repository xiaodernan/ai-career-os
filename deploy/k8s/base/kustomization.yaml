apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: careeros
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - minio.yaml
  - ai-service.yaml
  - discovery.yaml
  - backend.yaml
  - gateway.yaml
  - frontend.yaml
  - config-server.yaml
  - networkpolicy.yaml
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: ai-career-os
