name: career-os
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careeros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-career_os}
      POSTGRES_USER: ${POSTGRES_USER:-career_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_os_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career_os} -d ${POSTGRES_DB:-career_os}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: careeros-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    container_name: careeros-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-careeros-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-careeros_minio_dev_password}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-careeros-minio-admin} $${MINIO_ROOT_PASSWORD:-careeros_minio_dev_password} &&
      mc mb -p local/careeros-files || true &&
      mc anonymous set private local/careeros-files || true &&
      echo 'bucket ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-careeros-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-careeros_minio_dev_password}

  # One-shot demo seed: populates the job market once the Flyway schema exists.
  # Runs on plain `docker compose up -d postgres redis minio` (no app profile
  # needed) and is idempotent, so it is safe on every `up`.
  seed-jobs:
    image: pgvector/pgvector:pg16
    container_name: careeros-seed
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/seed:/seed:ro
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-career_os}
      PGUSER: ${POSTGRES_USER:-career_os}
      PGPASSWORD: ${POSTGRES_PASSWORD:-career_os_dev_password}
    entrypoint: >
      /bin/sh -c "
      i=0;
      until psql -tAc \"SELECT to_regclass('public.jobs')\" | grep -q jobs; do
        i=$$((i+1));
        if [ $$i -ge 60 ]; then echo 'schema not ready after 120s — skipping job seed (run: docker compose run --rm seed-jobs)'; exit 0; fi;
        sleep 2;
      done;
      psql -v ON_ERROR_STOP=1 -f /seed/01_jobs.sql
      "

  # ---- application stack: docker compose --profile app up ----
  ai-service:
    profiles: [app]
    build: ./ai-service
    container_name: careeros-ai
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-career_os}:${POSTGRES_PASSWORD:-career_os_dev_password}@postgres:5432/${POSTGRES_DB:-career_os}
      BACKEND_BASE_URL: http://backend:8080
      APP_ENV: ${APP_ENV:-dev}
      # Providers are named here so they can be overridden from the shell: an
      # `environment:` entry beats `env_file:`, whereas the shell environment only
      # feeds interpolation. Without these two lines, `.env` wins unconditionally and
      # the stack starts healthy but every AI call 500s, because `.env` selects the
      # hosted providers while leaving their keys empty:
      #   ConfigError: LLM_PROVIDER=openai_compat requires LLM_API_KEY
      # With them, the offline demo works with no keys at all:
      #   LLM_PROVIDER=mock EMBEDDING_PROVIDER=hash docker-compose --profile app up -d
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    profiles: [app]
    build: ./backend
    container_name: careeros-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      AI_SERVICE_BASE_URL: http://ai-service:8000
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3000}
      # The console email transport withholds the message body (reset links carry
      # a usable token) unless this is on; the dev stack wants the link in the log
      # so the flow can be walked by hand. Stacks without this entry keep it off.
      APP_EMAIL_CONSOLE_LOGBODY: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    profiles: [app]
    build:
      context: ./frontend
      args:
        # The browser bundle inlines NEXT_PUBLIC_* at BUILD time, so the value has to be
        # a build arg; the runtime `environment:` entry below only reaches server-side
        # rendering. Both are set from one source so the two cannot disagree.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: careeros-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:
