name: career-os
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careeros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-career_os}
      POSTGRES_USER: ${POSTGRES_USER:-career_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_os_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career_os} -d ${POSTGRES_DB:-career_os}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: careeros-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO pulled their images from Docker Hub and quay in 2026-09; quay now
    # answers 401 to anonymous pulls, which is what killed the nightly's
    # `compose up`. pgsty/silo is the repackaged MinIO RELEASE build: runs as
    # root like this image did (the existing miniodata volume keeps its
    # ownership), ships mc+curl+sh so one image serves the server and the
    # minio-init client, and `mc ready local` works as the healthcheck.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: careeros-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-careeros-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-careeros_minio_dev_password}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-careeros-minio-admin} $${MINIO_ROOT_PASSWORD:-careeros_minio_dev_password} &&
      mc mb -p local/careeros-files || true &&
      mc anonymous set private local/careeros-files || true &&
      echo 'bucket ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-careeros-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-careeros_minio_dev_password}

  # One-shot demo seed: populates the job market once the Flyway schema exists.
  # Runs on plain `docker compose up -d postgres redis minio` (no app profile
  # needed) and is idempotent, so it is safe on every `up`.
  seed-jobs:
    image: pgvector/pgvector:pg16
    container_name: careeros-seed
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/seed:/seed:ro
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-career_os}
      PGUSER: ${POSTGRES_USER:-career_os}
      PGPASSWORD: ${POSTGRES_PASSWORD:-career_os_dev_password}
    entrypoint: >
      /bin/sh -c "
      i=0;
      until psql -tAc \"SELECT to_regclass('public.jobs')\" | grep -q jobs; do
        i=$$((i+1));
        if [ $$i -ge 60 ]; then echo 'schema not ready after 120s — skipping job seed (run: docker compose run --rm seed-jobs)'; exit 0; fi;
        sleep 2;
      done;
      psql -v ON_ERROR_STOP=1 -f /seed/01_jobs.sql
      "

  # ---- application stack: docker compose --profile app up ----
  ai-service:
    profiles: [app]
    build:
      context: ./ai-service
      args:
        APP_BUILD_SHA: ${APP_BUILD_SHA:-dev}
    container_name: careeros-ai
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-career_os}:${POSTGRES_PASSWORD:-career_os_dev_password}@postgres:5432/${POSTGRES_DB:-career_os}
      BACKEND_BASE_URL: http://backend:8080
      APP_ENV: ${APP_ENV:-dev}
      # Providers are named here so they can be overridden from the shell: an
      # `environment:` entry beats `env_file:`, whereas the shell environment only
      # feeds interpolation. Without these two lines, `.env` wins unconditionally and
      # the stack starts healthy but every AI call 500s, because `.env` selects the
      # hosted providers while leaving their keys empty:
      #   ConfigError: LLM_PROVIDER=openai_compat requires LLM_API_KEY
      # With them, the offline demo works with no keys at all:
      #   LLM_PROVIDER=mock EMBEDDING_PROVIDER=hash docker-compose --profile app up -d
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      # Cache (Epic 118). The service name, not the host's 16380: inside the compose
      # network Redis answers in microseconds, while the published port goes through
      # Docker Desktop's proxy. The backend is deliberately not a dependency -- a cache
      # that must be up for the engine to boot is a dependency wearing a cache's name.
      REDIS_URL: redis://redis:6379/0
      CACHE_BACKEND: ${CACHE_BACKEND:-off}
    ports:
      - "127.0.0.1:8000:8000"
    # The image carries python, not curl or wget. A 500 (its database half is gone)
    # exits non-zero: this probe gates the backend's start, so it must mean "can serve".
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    profiles: [app]
    build:
      context: ./backend
      args:
        APP_BUILD_SHA: ${APP_BUILD_SHA:-dev}
    container_name: careeros-backend
    restart: unless-stopped
    # Longer than the JVM's 30-second graceful-shutdown phase (application.yml):
    # Docker's 10-second default would SIGKILL the backend mid-drain. 40s leaves the
    # JVM time to cut what outlived its own bound and exit; ShutdownContractTest
    # requires at least phase + 5s in both compose files.
    stop_grace_period: 40s
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      AI_SERVICE_BASE_URL: http://ai-service:8000
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3000}
      # 98.1: the `eureka` profile turns registration on and names the compose registry.
      # Outside it the backend never contacts a registry, so a laptop without this
      # service still boots and serves.
      SPRING_PROFILES_ACTIVE: eureka
      EUREKA_DEFAULT_ZONE: http://discovery:8761/eureka/
      BACKEND_HOSTNAME: backend
      # The console email transport withholds the message body (reset links carry
      # a usable token) unless this is on; the dev stack wants the link in the log
      # so the flow can be walked by hand. Stacks without this entry keep it off.
      APP_EMAIL_CONSOLE_LOGBODY: "true"
    ports:
      - "127.0.0.1:8080:8080"
    # `/api/v1/health` answers 200 whether the body says ok or degraded, so a dependency
    # outage is reported, not restart-looped. Docker's timeout is above the route's own
    # 2-second probe bound.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      discovery:
        condition: service_healthy

  # The registry (Epic 98): the edge learns service addresses from here instead of a
  # configuration list. It is deliberately its own process -- a registry sharing a JVM
  # with the service it describes cannot report that service's death -- and it holds no
  # data of its own, so losing it costs the current answer and nothing durable.
  discovery:
    profiles: [app]
    build:
      context: ./discovery
      args:
        APP_BUILD_SHA: ${APP_BUILD_SHA:-dev}
    container_name: careeros-discovery
    restart: unless-stopped
    environment:
      EUREKA_HOSTNAME: discovery
      # Single-node default: the zone names this node itself, and with the client
      # off (register/fetch false) the URL is inert. The two-node cloud demo
      # (Epic 113) names the whole pair here instead -- Eureka's own peer setup
      # lists every node of the pair in each node's zone:
      #   EUREKA_MAIN_PEER_ZONE=http://discovery:8761/eureka/,http://discovery-peer:8761/eureka/
      # -- see the discovery-peer service.
      EUREKA_DEFAULT_ZONE: ${EUREKA_MAIN_PEER_ZONE:-http://discovery:8761/eureka/}
    # Loopback only: the dashboard is an operator view, not a public surface.
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  # The second registry (Epic 113): peer-awareness, opt-in through the `cloud`
  # profile -- `docker compose --profile app --profile cloud up` runs two
  # registries that gossip. Each node's zone names the whole pair (the main's
  # via EUREKA_MAIN_PEER_ZONE, the peer's below), and the `peer` profile turns
  # the client on (register + fetch), which is what makes the pair replicate
  # instead of ignore each other. Start it with the app profile already up:
  # the peer needs no other service.
  discovery-peer:
    profiles: [cloud]
    build:
      context: ./discovery
      args:
        APP_BUILD_SHA: ${APP_BUILD_SHA:-dev}
    container_name: careeros-discovery-peer
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: peer
      EUREKA_HOSTNAME: discovery-peer
      EUREKA_DEFAULT_ZONE: http://discovery:8761/eureka/
    # Loopback only: same rule as the main registry.
    ports:
      - "127.0.0.1:8762:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  # The edge (Epic 88): one front door for the browser. The backend is still the only
  # service that holds the internal token; the gateway forwards and answers for the
  # system when nothing is behind it. Optional -- a deployment may keep pointing the
  # browser straight at the backend.
  gateway:
    profiles: [app]
    build:
      context: ./gateway
      args:
        APP_BUILD_SHA: ${APP_BUILD_SHA:-dev}
    container_name: careeros-gateway
    restart: unless-stopped
    environment:
      # The dev stack uses the default single-node mode: the gateway's simple discovery
      # client is the answer for `backend` (the same mode ai-service already uses).
      # The eureka profile remains the opt-in discovery demo: set
      # SPRING_PROFILES_ACTIVE=eureka and it empties the simple list so the registry is
      # the only answer -- the two paths are mutually exclusive by design (a half
      # configured edge that kept both would send half its traffic to an address the
      # registry does not know about). The registry resolves `lb://backend` only when
      # the backend registers under the service id `backend` (appname + vipAddress;
      # see the backend's on-profile eureka block).
      # Once traffic works, the route answers; the probe's only question is the
      # process, and the fallback is the failure contract of the edge.
      # GATEWAY_BACKEND_URI is the address the simple client hands the load balancer;
      # inside the compose network that is the backend service, not this container.
      GATEWAY_BACKEND_URI: http://backend:8080
      GATEWAY_HOSTNAME: gateway
      GATEWAY_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
      discovery:
        condition: service_healthy

  # Opt-in Spring Cloud Config Server (Epic 103): centralizes externalized
  # configuration for gateway/backend/discovery when enabled via config client settings.
  config-server:
    profiles: [config]
    build:
      context: ./config-server
    container_name: careeros-config-server
    restart: unless-stopped
    environment:
      CONFIG_SERVER_PORT: 8888
      CONFIG_SERVER_PROFILE: native
      CONFIG_SERVER_SEARCH_LOCATIONS: classpath:/config-repo,file:/config
    volumes:
      - ./config-server/src/main/resources/config-repo:/config:ro
    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    profiles: [app]
    build:
      context: ./frontend
      args:
        # The browser bundle inlines NEXT_PUBLIC_* at BUILD time, so the value has to be
        # a build arg; the runtime `environment:` entry below only reaches server-side
        # rendering. Both are set from one source so the two cannot disagree.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
        # 33.4: the public half of the backend's own VAPID pair, so the browser subscribes
        # with the key the backend signs with. Empty means push is off, and the switch says so.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${APP_PUSH_VAPID_PUBLIC_KEY:-}
    container_name: careeros-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${APP_PUSH_VAPID_PUBLIC_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
