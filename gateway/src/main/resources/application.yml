server:
  port: ${GATEWAY_PORT:8081}

spring:
  application:
    name: career-os-gateway
  config:
    import: "optional:configserver:"
  cloud:
    config:
      # Epic 101: opt-in Spring Cloud Config (inert by default).
      enabled: ${SPRING_CLOUD_CONFIG_ENABLED:false}
      fail-fast: ${SPRING_CLOUD_CONFIG_FAIL_FAST:false}
    # The backend is addressed through Spring Cloud's discovery abstraction, not a
    # literal URL: the simple client holds the configured instance list, and the
    # load-balancer filter turns `lb://backend` into one of them. Today the list has
    # one entry; adding a second is a configuration change, not a code change.
    discovery:
      client:
        simple:
          instances:
            backend:
              - uri: ${GATEWAY_BACKEND_URI:http://localhost:8080}
    gateway:
      server:
        webflux:
          # The backend's logs and address-based decisions should see the browser, not
          # the edge. 4.3 leaves the header filter off unless told; this turns it on.
          # The edge is the trust boundary here, so every address that reaches it is
          # allowed to contribute the forwarded chain.
          trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:.*}
          x-forwarded:
            enabled: true
            for-enabled: true
            host-enabled: true
            port-enabled: true
            proto-enabled: true
          # The edge and the backend both answer CORS. Two `Access-Control-Allow-Origin`
          # values make a browser reject the response it asked for, so the duplicate is
          # removed before the headers leave this process; the first value is the edge's
          # own answer and the one both configurations agree on.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            # The browser is not a service. A browser-supplied internal token never
            # reaches the domain backend, and a forged forwarding chain is removed before
            # the edge writes its own -- otherwise the backend would read an address the
            # caller chose for itself.
            - RemoveRequestHeader=X-Internal-Token
            - RemoveRequestHeader=Forwarded
            - RemoveRequestHeader=X-Forwarded-For
            - RemoveRequestHeader=X-Forwarded-Proto
            - RemoveRequestHeader=X-Forwarded-Host
            - RemoveRequestHeader=X-Forwarded-Port
          # One route today: the browser's API traffic belongs to the domain backend.
          # The engine stays behind the backend, which owns the internal token and the
          # circuit around it -- the edge should not hold either.
          routes:
            - id: backend
              uri: lb://backend
              predicates:
                - Path=/api/**
              filters:
                # An oversized body is refused before a byte reaches the backend: the
                # edge is the only place that can say no without spending the downstream's
                # parser. The default sits above the backend's 25 MB multipart cap, so a
                # file the backend would reject still gets the backend's own answer.
                - name: RequestSize
                  args:
                    maxSize: ${GATEWAY_MAX_REQUEST_SIZE:30MB}
                # A backend that is down should answer as "the system is unavailable",
                # not as a stack trace the browser cannot use. The fallback route is
                # served by this process, so it works while nothing behind it does.
                # It sits outside the retry: one logical call may try twice, but the
                # breaker counts the call, not each attempt, and a fallback answer is
                # never repeated.
                - name: CircuitBreaker
                  args:
                    name: backend
                    fallbackUri: forward:/_fallback/backend
                # A GET is safe to repeat: if the backend answered a server error or
                # the connection never opened, one more attempt costs nothing a user
                # would notice. POST and the rest are never repeated -- their work may
                # already have started, and the backend cannot undo it for us.
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    series: SERVER_ERROR
                    exceptions: java.io.IOException
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 200ms
                      factor: 2
                      basedOnPreviousValue: false
          httpclient:
            # A browser should not wait a minute for a connect that will not happen;
            # the response budget is above the backend's 180-second AI read budget,
            # because the edge must not cut a turn the backend still expects to finish.
            connect-timeout: 3000
            response-timeout: 300s
          # Same origins, verbs and headers the backend answers with (SecurityConfig);
          # a browser that passes one door and fails the other would be a bug report
          # nobody can reproduce.
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${GATEWAY_CORS_ORIGINS:http://localhost:3000}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: [Authorization, Content-Type, X-Internal-Token, X-Request-Id, traceparent, tracestate]
                exposed-headers: [X-Request-Id, traceparent]
                max-age: 3600

eureka:
  client:
    # Inert unless the `eureka` profile asks for it. The local stack's simple instance
    # list is one backend and no extra process; a registry earns its keep when a second
    # instance exists and the edge should learn about it without a redeploy.
    enabled: ${GATEWAY_EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    # The edge is worth seeing on the dashboard: it answers traffic and its health is
    # part of what an operator wants to read there.
    register-with-eureka: ${GATEWAY_EUREKA_REGISTER:true}
    fetch-registry: ${GATEWAY_EUREKA_FETCH:true}
  instance:
    hostname: ${GATEWAY_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${APP_BUILD_SHA:dev}:${server.port}
    metadata-map:
      build-sha: ${APP_BUILD_SHA:dev}
      service: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    build-sha: ${APP_BUILD_SHA:dev}

logging:
  pattern:
    # The backend already carries this slot; the edge should be quotable the same way.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:--}] %logger{36} - %msg%n"
---
# `SPRING_PROFILES_ACTIVE=eureka` is the switch that makes the registry authoritative.
# The simple instance list is emptied in the same document: leaving it populated would
# merge the configured address into every load-balancing decision, so half the traffic
# would keep going to the laptop's backend while the registry was reporting a fleet.
spring:
  config:
    activate:
      on-profile: eureka
  cloud:
    discovery:
      client:
        simple:
          instances:
            backend: []

eureka:
  client:
    enabled: true
