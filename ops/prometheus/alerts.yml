# Prometheus alerting rules for AI Career OS (roadmap 19.9).
#
# Load with an existing Prometheus:
#   rule_files:
#     - /etc/prometheus/careeros-alerts.yml
# Check before reloading:
#   promtool check rules ops/prometheus/alerts.yml
#
# The metrics come from the backend's Micrometer scrape endpoint,
# GET /actuator/prometheus. Micrometer writes dots, the exporter renders them as
# underscores, so `careeros.ingestion.last.success.timestamp` arrives as
# `careeros_ingestion_last_success_timestamp` -- each rule below names the arriving
# form, and docs/RUNBOOK.md says what to do when one fires.
#
# Every alert carries the same two labels: service (which stack raised it) and
# severity (critical pages, warning is read the next morning).
groups:
  - name: career-os-night
    rules:
      # The nightly sweep runs at 03:20 (careeros.ingestion.cron). A completed run
      # moves the success marker; a failed one does not, so this fires whether the
      # night never started or every feed in it failed. 26 hours is a night plus two
      # hours of slack for a slow host or a late deploy, and it is the same number in
      # docs/RUNBOOK.md -- change both or neither.
      - alert: CareerOSIngestionNightMissed
        expr: time() - careeros_ingestion_last_success_timestamp > 93600
        for: 10m
        labels:
          service: career-os-backend
          severity: critical
        annotations:
          summary: "No ingestion run has completed in over 26 hours"
          description: >-
            The last completed run was {{ $value | humanizeDuration }} ago. The sweep
            either never started (check the scheduler cron and the backend log line
            "nightly ingestion") or every feed in it failed (check the runs board).
          runbook: "docs/RUNBOOK.md#a-night-that-never-succeeded"

      # One dead feed is normal and is recorded as that feed's own failed run. This
      # rule is about a majority: at least three runs in six hours, more than half of
      # them failed. The count floor keeps a single night of two dead feeds from
      # paging, and the ratio keeps a busy night of one failure from paging.
      - alert: CareerOSIngestionFailing
        expr: |
          sum(increase(careeros_ingestion_runs_total{status="failed"}[6h]))
            / sum(increase(careeros_ingestion_runs_total[6h])) > 0.5
          and
          sum(increase(careeros_ingestion_runs_total[6h])) >= 3
        for: 15m
        labels:
          service: career-os-backend
          severity: warning
        annotations:
          summary: "More than half of the ingestion runs in the last six hours failed"
          description: >-
            {{ $value | humanizePercentage }} of the runs in the window failed. Read
            the runs board for the error sentences; a single feed's outage is that
            feed's problem, a majority is the fetcher's or the planner's.
          runbook: "docs/RUNBOOK.md#a-night-where-every-feed-failed"

      # The nightly verification is the job that proves the stack still works together, and
      # it records its own finish through the internal surface. The marker moves on every
      # finished night, passed or failed -- this rule is about the cadence stopping, the
      # failures have the rule below. 129600 is 36 hours, twice the daily schedule and the
      # same window the monitoring page calls stale: change the Java constant and this
      # number together, or the page and the pager disagree.
      - alert: CareerOSNightlyVerificationStale
        expr: time() - careeros_nightly_last_finished_timestamp > 129600
        for: 10m
        labels:
          service: career-os-backend
          severity: critical
        annotations:
          summary: "No nightly verification has finished in over 36 hours"
          description: >-
            The newest nightly record finished {{ $value | humanizeDuration }} ago. Either
            the scheduled verification stopped running (check the workflow's schedule) or
            its recording step is failing (check the run's log for the internal POST).
          runbook: "docs/RUNBOOK.md#the-nightly-verification-stopped-reporting"

      # Two failures in a row is the page's own warning line: a single failed night is
      # visible on its row, and a streak of two means the stack is drifting rather than
      # flinching. The count is the same number the monitoring card warns at.
      - alert: CareerOSNightlyVerificationFailing
        expr: careeros_nightly_consecutive_failures >= 2
        for: 10m
        labels:
          service: career-os-backend
          severity: warning
        annotations:
          summary: "The last {{ $value }} nightly verifications failed in a row"
          description: >-
            Read the newest rows on the monitoring page for the failing step's detail; the
            streak ends at the first passed night, so a green night clears this without an
            operator action.
          runbook: "docs/RUNBOOK.md#the-nightly-verification-keeps-failing"

      # The budget is a rolling 24-hour spend, read from the ai_usage_events ledger
      # (the same rows the usage figures come from). Five dollars a day is the
      # default for a single-tenant install; a deployment with more traffic raises it
      # in its own copy of this file, and docs/RUNBOOK.md says where the spend is
      # reported before it is raised.
      - alert: CareerOSAiBudgetBurn
        expr: careeros_ai_cost_usd_24h > 5
        for: 15m
        labels:
          service: career-os-backend
          severity: warning
        annotations:
          summary: "AI spend in the trailing 24 hours is above the 5 USD budget"
          description: >-
            The ledger says {{ $value | humanize }} USD was spent on AI calls in the
            last 24 hours. Find the expensive callers before raising the budget:
            embeddings and re-ranking dominate on a busy install.
          runbook: "docs/RUNBOOK.md#the-ai-budget-is-burning"

      # The weekly letter is one account's Monday, and a refusal is recorded on the
      # letter's own row rather than retried within the sweep. The daily retry clock
      # tries again at 09:05 UTC, but the relay is the fault the operator has to fix,
      # so the first refusal inside six hours pages. A letter that leaves, on the
      # sweep or on a retry, moves the sent series and clears the alert's window.
      - alert: CareerOSDigestDeliveryFailing
        expr: increase(careeros_digest_delivery_total{outcome="refused"}[6h]) > 0
        for: 10m
        labels:
          service: career-os-backend
          severity: warning
        annotations:
          summary: "A weekly letter was refused by the mail relay"
          description: >-
            {{ $value | humanize }} weekly letter(s) were refused in the last six hours.
            Read `weekly_digests.delivery_error` for the relay's own sentence; the retry
            clock tries the letter again each morning until it leaves or has been tried
            five times.
          runbook: "docs/RUNBOOK.md#a-weekly-letter-the-relay-refused"

      # The signal letter differs from the weekly one in how a refusal behaves: the sweep
      # retries the same episode every morning while it is still visible, so one
      # undeliverable address refuses once a day indefinitely. That is a mailbox problem,
      # not a relay outage, and it must not page daily -- hence a floor of three, the same
      # "a majority is the fetcher's problem" shape the ingestion rule uses. Three
      # refusals inside six hours means several accounts in one morning, which is the
      # relay or its configuration. The sent series is the other half: a morning that
      # accepts letters on either side of the refusals still leaves the count over zero,
      # and the operator reads the log for which addresses were refused.
      - alert: CareerOSSignalMailFailing
        expr: sum(increase(careeros_signals_delivery_total{outcome="refused"}[6h])) >= 3
        for: 10m
        labels:
          service: career-os-backend
          severity: warning
        annotations:
          summary: "The mail relay refused three or more signal mails in the last six hours"
          description: >-
            {{ $value | humanize }} account letters were refused in the last six hours.
            The backend log names each one ("the signal mail to ... was refused") and a
            refused letter latches nothing, so tomorrow's sweep tries again; read
            docs/RUNBOOK.md before touching the mailbox, because one address is usually
            the culprit.
          runbook: "docs/RUNBOOK.md#the-morning-mail-is-refused"

      # The delivered marker cannot answer "did the clock still run?" -- an install with
      # nothing waiting never moves it -- so the sweep has its own heartbeat, moved at the
      # end of every completed pass. This rule catches the failure the delivery rules
      # cannot see: a scheduler that stopped (a bad careeros.signals.cron, a bean that
      # never started, a backend that stays down). 129600 is 36 hours, twice the daily
      # cadence and the same window the nightly stale rule uses; change the number and the
      # runbook together.
      - alert: CareerOSSignalSweepStale
        expr: time() - careeros_signals_last_sweep_timestamp > 129600
        for: 10m
        labels:
          service: career-os-backend
          severity: warning
        annotations:
          summary: "No signal-mail sweep has finished in over 36 hours"
          description: >-
            The last completed morning mail sweep was {{ $value | humanizeDuration }} ago.
            Either the scheduler stopped (check `careeros.signals.cron` and the backend log
            for "the signal mail sweep could not run") or the backend has been down long
            enough that its boot time is the only reading. The in-app inbox is unaffected;
            only the mail lags.
          runbook: "docs/RUNBOOK.md#the-morning-sweep-stopped"

      # The weekly letter's own clock, with a window that respects its cadence: the Monday
      # compose runs once a week, so a silence has to be read in weeks, not hours. 691200 is
      # eight days -- the seven between Mondays plus a day of grace -- and fires the day after
      # a Monday that never ran. The delivered marker cannot answer this: a week with no
      # applications writes no letter and that is healthy; only the compose heartbeat moves on
      # a quiet Monday. The morning retry is a different promise and does not move it.
      - alert: CareerOSDigestSweepStale
        expr: time() - careeros_digest_last_sweep_timestamp > 691200
        for: 10m
        labels:
          service: career-os-backend
          severity: warning
        annotations:
          summary: "No Monday digest compose has finished in over eight days"
          description: >-
            The last completed Monday compose was {{ $value | humanizeDuration }} ago, so at
            least one week's letter was never written. Check `careeros.digest.cron` and the
            backend log for "the weekly digest could not run" or for the compose line that
            should follow each Monday; a missed week cannot be recomposed through any route,
            so the job is to make the next Monday happen.
          runbook: "docs/RUNBOOK.md#the-monday-letter-was-never-written"

      # Retention's heartbeat (roadmap 28.2). The deleted-rows counter answers how much a
      # sweep removed, not whether it ran: a stopped sweep leaves a scrape showing the last
      # value, which cannot be told from a night that deleted nothing. The gauge moves after
      # every completed pass, with or without deletions and even when a table failed -- a
      # failed table has its own WARN line and a missing per-table series.
      - alert: CareerOSRetentionSweepStale
        expr: time() - careeros_retention_last_sweep_timestamp > 129600
        for: 10m
        labels:
          service: career-os-backend
          severity: warning
        annotations:
          summary: "No retention sweep has finished in over 36 hours"
          description: >-
            The last completed credential-retention sweep was {{ $value | humanizeDuration }}
            ago, so expired refresh, reset and address-change rows are accumulating again.
            Check `careeros.retention.cron` (default 04:47) and the backend log for
            "Retention sweep removed"; a pass whose tables failed moves this gauge too and
            logs "Retention sweep failed for" for each one.
          runbook: "docs/RUNBOOK.md#the-retention-sweep-stopped"
