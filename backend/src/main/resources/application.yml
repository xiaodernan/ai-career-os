server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: career-os-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:career_os}
    username: ${POSTGRES_USER:career_os}
    # Published default: a prod boot (APP_ENV=prod) refuses to start on it. The
    # guard and docs/DEPLOYMENT.md's checklist carry the whole list.
    password: ${POSTGRES_PASSWORD:dev_pg_pass_9f3k}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}
      # Redis backs exactly two things: the sliding-window rate limiter and the health
      # ping. Nothing else depends on it, so failing fast is strictly better than
      # waiting -- the limiter's documented fail-open path then serves the request
      # instead of stalling on it. Unset, Lettuce's defaults applied and a Redis outage
      # left every endpoint (including /health) unable to answer within 40s.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  async:
    executor:
      core-size: 4
      max-size: 16
      queue-capacity: 200

app:
  # The API admits only these browser origins, matched against the browser's Origin header
  # exactly. The shipped value is the dev shell; with APP_ENV=prod the backend refuses a
  # loopback or example-domain list, a spelling with a path, and a list the deployed shell
  # is not in (the origin of APP_WEB_BASE_URL) -- ProductionGuard.
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000}
  # The rate limiter and the session record count a caller by this address. The shipped
  # topology is a reverse proxy that writes X-Forwarded-For, so a deployment behind that
  # proxy sets this to true; a service reached directly must leave it off, or a client can
  # rotate the header and buy a fresh login bucket per request (docs/SECURITY.md).
  http:
    trust-forwarded-for: ${APP_HTTP_TRUST_FORWARDED_FOR:false}
  # "dev" unless the deployment says otherwise. With APP_ENV=prod the backend refuses
  # to start on the JWT, mail-link or internal-token defaults this repository publishes
  # (ProductionGuard), so a forgotten secret is a failed boot instead of a forgeable one.
  deployment:
    env: ${APP_ENV:dev}
  # The origin every mailed link is built from (password reset, email change, unsubscribe).
  # The shipped default is loopback, so a prod boot (APP_ENV=prod) refuses it and the
  # example's your-domain.com (ProductionGuard): the link has to open in the reader's browser.
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:3000}
  # console logs each letter instead of sending it; smtp hands it to a relay and
  # refuses to start without a host and a from address the relay accepts. With
  # APP_ENV=prod the backend also refuses to start on console (ProductionGuard):
  # a production reset link that lands in the log never reaches the mailbox.
  email:
    provider: ${APP_EMAIL_PROVIDER:console}
    from: ${APP_EMAIL_FROM:}
    smtp:
      host: ${APP_EMAIL_SMTP_HOST:}
      port: ${APP_EMAIL_SMTP_PORT:587}
      username: ${APP_EMAIL_SMTP_USERNAME:}
      password: ${APP_EMAIL_SMTP_PASSWORD:}
      starttls: ${APP_EMAIL_SMTP_STARTTLS:true}
      ssl: ${APP_EMAIL_SMTP_SSL:false}
  # The key that signs the unsubscribe links the letters carry (roadmap 23.1). It never
  # leaves the server; rotating it retires every link ever mailed at once, which is the
  # answer to a forwarded letter or a leaked mailbox.
  mail:
    link-secret: ${APP_MAIL_LINK_SECRET:dev-only-mail-link-secret-please-change-me-0123456789abcdef}
  # The key that seals every enrolled authenticator seed at rest (roadmap 36.1). The
  # shipped value is published, so a prod boot (APP_ENV=prod) refuses it (ProductionGuard):
  # a database dump plus a published key is every account's second factor. Rotating it
  # leaves every seed unreadable -- those accounts sign in on their password until they
  # enroll again (docs/DEPLOYMENT.md's rotation note).
  security:
    mfa-secret: ${APP_MFA_SECRET:dev-only-mfa-secret-please-change-me-0123456789abcdef}
  # Web Push (roadmap 33.2). Both VAPID keys or neither: with neither the sender is a
  # no-op that reports "not configured" and registrations are still accepted, and a
  # boot with only one half is refused (PushConfig) because it would run while every
  # wake failed. The public key is the browser's `applicationServerKey`; the private
  # key signs the ES256 VAPID token and never leaves the server. `contact` is RFC
  # 8292's `sub` claim (a mailto or https URL); empty falls back to the public web
  # origin above. `ttl-seconds` is how long a push service may hold a wake for an
  # offline browser, half a day by default.
  push:
    vapid-public-key: ${APP_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${APP_PUSH_VAPID_PRIVATE_KEY:}
    contact: ${APP_PUSH_CONTACT:}
    ttl-seconds: ${APP_PUSH_TTL_SECONDS:43200}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-me-0123456789abcdef0123456789abcdef}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  internal:
    token: ${INTERNAL_API_TOKEN:shared-secret-between-backend-and-ai-service}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:19000}
    # The shipped secret is published, so a prod boot refuses it; the shipped user
    # name is a name, and only a change-me placeholder is refused on that side.
    access-key: ${MINIO_ACCESS_KEY:careeros-minio-admin}
    secret-key: ${MINIO_SECRET_KEY:careeros_minio_dev_password}
    bucket: ${MINIO_BUCKET:careeros-files}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  ratelimit:
    enabled: true
    auth-per-minute: ${RATELIMIT_AUTH_PER_MINUTE:10}
    ai-per-minute: ${RATELIMIT_AI_PER_MINUTE:30}
    mail-per-minute: ${RATELIMIT_MAIL_PER_MINUTE:5}
    mfa-per-minute: ${RATELIMIT_MFA_PER_MINUTE:5}
  upload:
    max-file-size-bytes: 20971520
    presigned-url-ttl-seconds: 600
  # Expired refresh, password-reset and address-change rows are deleted nightly once
  # they are this many days past expiry (see auth/retention). The grace window keeps a
  # late request or a support investigation from finding the row already gone.
  retention:
    expired-token-days: ${RETENTION_EXPIRED_TOKEN_DAYS:30}

springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /api-docs/ui

management:
  endpoints:
    web:
      exposure:
        # /actuator/health for orchestrators, /actuator/prometheus for the metrics
        # scrape. Nothing else: the rest of the actuator (env, beans, heapdump)
        # stays off the wire entirely.
        include: health,prometheus
  health:
    # Redis liveness is already reported by /api/v1/health as a degraded-but-up
    # state (fail-open, docs/SECURITY.md). Actuator's own redis indicator would
    # flip /actuator/health to 503 on a rate-limiter outage, telling every
    # orchestrator the backend is down when it is serving fine -- the same
    # outage-shaped lie the 500ms redis client timeouts exist to avoid.
    redis:
      enabled: false

logging:
  # Every request logs under the id `RequestIdFilter` puts on its answer; boot lines have none.
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-}] %logger{28} - %msg%n"
