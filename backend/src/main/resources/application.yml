server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: career-os-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:career_os}
    username: ${POSTGRES_USER:career_os}
    password: ${POSTGRES_PASSWORD:dev_pg_pass_9f3k}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}
      # Redis backs exactly two things: the sliding-window rate limiter and the health
      # ping. Nothing else depends on it, so failing fast is strictly better than
      # waiting -- the limiter's documented fail-open path then serves the request
      # instead of stalling on it. Unset, Lettuce's defaults applied and a Redis outage
      # left every endpoint (including /health) unable to answer within 40s.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  async:
    executor:
      core-size: 4
      max-size: 16
      queue-capacity: 200

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000}
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:3000}
  # console logs each letter instead of sending it; smtp hands it to a relay and
  # refuses to start without a host and a from address the relay accepts.
  email:
    provider: ${APP_EMAIL_PROVIDER:console}
    from: ${APP_EMAIL_FROM:}
    smtp:
      host: ${APP_EMAIL_SMTP_HOST:}
      port: ${APP_EMAIL_SMTP_PORT:587}
      username: ${APP_EMAIL_SMTP_USERNAME:}
      password: ${APP_EMAIL_SMTP_PASSWORD:}
      starttls: ${APP_EMAIL_SMTP_STARTTLS:true}
      ssl: ${APP_EMAIL_SMTP_SSL:false}
  # The key that signs the unsubscribe links the letters carry (roadmap 23.1). It never
  # leaves the server; rotating it retires every link ever mailed at once, which is the
  # answer to a forwarded letter or a leaked mailbox.
  mail:
    link-secret: ${APP_MAIL_LINK_SECRET:dev-only-mail-link-secret-please-change-me-0123456789abcdef}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-me-0123456789abcdef0123456789abcdef}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  internal:
    token: ${INTERNAL_API_TOKEN:shared-secret-between-backend-and-ai-service}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:19000}
    access-key: ${MINIO_ACCESS_KEY:careeros-minio-admin}
    secret-key: ${MINIO_SECRET_KEY:careeros_minio_dev_password}
    bucket: ${MINIO_BUCKET:careeros-files}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  ratelimit:
    enabled: true
    auth-per-minute: ${RATELIMIT_AUTH_PER_MINUTE:10}
    ai-per-minute: ${RATELIMIT_AI_PER_MINUTE:30}
    mail-per-minute: ${RATELIMIT_MAIL_PER_MINUTE:5}
  upload:
    max-file-size-bytes: 20971520
    presigned-url-ttl-seconds: 600

springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /api-docs/ui

management:
  endpoints:
    web:
      exposure:
        # /actuator/health for orchestrators, /actuator/prometheus for the metrics
        # scrape. Nothing else: the rest of the actuator (env, beans, heapdump)
        # stays off the wire entirely.
        include: health,prometheus
  health:
    # Redis liveness is already reported by /api/v1/health as a degraded-but-up
    # state (fail-open, docs/SECURITY.md). Actuator's own redis indicator would
    # flip /actuator/health to 503 on a rate-limiter outage, telling every
    # orchestrator the backend is down when it is serving fine -- the same
    # outage-shaped lie the 500ms redis client timeouts exist to avoid.
    redis:
      enabled: false

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{28} - %msg%n"
