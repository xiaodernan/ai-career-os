server:
  port: ${CONFIG_SERVER_PORT:8888}

spring:
  application:
    name: career-os-config-server
  profiles:
    # Native backend serves configuration from a local directory/classpath without git.
    active: ${CONFIG_SERVER_PROFILE:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_SERVER_SEARCH_LOCATIONS:classpath:/config-repo,file:./config-repo}

management:
  metrics:
    tags:
      # Unified Micrometer tag for every Spring Cloud service (Epic 108.14): a
      # scrape can aggregate by application instead of by path or pod name.
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,env,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    build-sha: ${APP_BUILD_SHA:dev}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:--}] %logger{36} - %msg%n"
