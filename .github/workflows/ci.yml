# AI Career OS — CI & scheduled verification
#
# The repo's CI runs on a self-hosted runner co-located with the user's working
# machine. Recent runs targeted `ubuntu-latest` while the repo had no hosted
# quota and never executed — every push appeared to "cancel" because the previous
# one was still queued and the new one cancelled it. Local runner: 'lenovo-career-os'.
#
# Offline suites pass locally (see each job). The nightly full-stack job stays
# cloud-shaped: it requires Docker; the local runner has Docker Desktop and the
# task works the same.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  # PRs cancel stale runs (fast feedback); pushes/nightly keep cancel too —
  # with a real runner working off a queue, self-cancel just drowns capacity.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  LLM_PROVIDER: mock
  EMBEDDING_PROVIDER: hash
  RUNNER_ENV: self-hosted

jobs:
  # --------------------------------------------------------------------------- #
  # Offline fast gate — runs on every PR / push.
  #
  # These jobs use the Windows host's local toolchain. The default actions/setup-*
  # family relies on the GitHub toolcache and a network fetch path that has been
  # unreliable in this environment; the host already has what we need at the
  # system level and every offline gate has been passing against it locally.
  # --------------------------------------------------------------------------- #
  ai-service:
    name: ai-service (pytest, offline)
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          py -3.11 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Security advisories (pip-audit)
        run: |
          .\.venv\Scripts\python.exe -m pip install pip-audit
          .\.venv\Scripts\python.exe -m pip_audit -r requirements.txt
      - name: Test
        run: .\.venv\Scripts\python.exe -m pytest -q

  frontend:
    name: frontend (vitest + tsc)
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Unit tests
        run: npx vitest run
      - name: Type check
        run: npx tsc --noEmit
      - name: Dependency advisories (npm audit)
        run: node ../scripts/npm-audit-gate.mjs

  backend:
    name: backend (maven unit tests, self-hosted)
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: mvn -B -q test -Dtest='*Test'

  # --------------------------------------------------------------------------- #
  # Spring Cloud microservices contracts — fast, push-only visibility.
  # --------------------------------------------------------------------------- #
  springcloud:
    name: springcloud (microservices contract gates)
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          py -3.11 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Spring Cloud contract gates
        run: |
          .\.venv\Scripts\python.exe -m pytest -q \
            tests/test_the_spring_cloud_actuator_surface_contract.py \
            tests/test_the_config_client_stays_opt_in.py \
            tests/test_the_spring_cloud_services_print_a_common_metrics_tag.py \
            tests/test_the_spring_cloud_services_publish_latency_histograms.py \
            tests/test_the_spring_cloud_services_publish_build_sha_in_info.py \
            tests/test_the_spring_cloud_readiness_runbook_exists.py \
            tests/test_the_topology_page_reads_the_fleet_the_backend_writes.py \
            tests/test_the_resilience_page_reads_the_breakers_the_backend_writes.py \
            tests/test_the_load_balancer_health_check_stays_on.py \
            tests/test_the_compose_files_parse.py \
            tests/test_the_alarms_name_metrics_that_ship_and_a_page_that_says_what_to_do.py

  springcloud-java:
    name: springcloud-java (gateway/discovery/config-server unit tests)
    runs-on: [self-hosted, Windows, X64]
    strategy:
      matrix:
        service: [gateway, discovery, config-server]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: mvn -B -q test -Dtest='*Test,*Tests'

  budget:
    name: frontend (bundle budget)
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build and check the budget
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080/api/v1
        run: npm run budget

  offline-gate:
    name: offline suites green
    needs: [ai-service, frontend, backend, springcloud, springcloud-java, budget]
    runs-on: [self-hosted, Windows, X64]
    if: always()
    steps:
      - name: Fail if any offline job failed
        run: |
          if ("${{ needs.ai-service.result }}" -ne "success") { Write-Output "ai-service ${{ needs.ai-service.result }}"; exit 1 }
          if ("${{ needs.frontend.result }}" -ne "success") { Write-Output "frontend ${{ needs.frontend.result }}"; exit 1 }
          if ("${{ needs.backend.result }}" -ne "success") { Write-Output "backend ${{ needs.backend.result }}"; exit 1 }
          if ("${{ needs.springcloud.result }}" -ne "success") { Write-Output "springcloud ${{ needs.springcloud.result }}"; exit 1 }
          if ("${{ needs.springcloud-java.result }}" -ne "success") { Write-Output "springcloud-java ${{ needs.springcloud-java.result }}"; exit 1 }
          if ("${{ needs.budget.result }}" -ne "success") { Write-Output "budget ${{ needs.budget.result }}"; exit 1 }

  # --------------------------------------------------------------------------- #
  # Keep the portfolio card honest — Epic 216.
  # --------------------------------------------------------------------------- #
  showcase:
    name: showcase (regenerate the portfolio card if the numbers moved)
    runs-on: [self-hosted, Windows, X64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Regenerate the card from measured truth
        run: py -3.11 scripts/showcase-sync.py
      - name: Commit it back, only when the numbers moved
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/showcase.html docs/LATEST.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore(showcase): regenerate the portfolio card [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          } else {
            Write-Output "the numbers didn't move — the committed card is current"
          }
      - name: Sync gh-pages with the current card
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-sync
          fetch-depth: 0
      - name: Push gh-pages only when the card moved
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Copy-Item frontend/public/showcase.html gh-pages-sync/index.html -Force
          Copy-Item frontend/public/showcase.html gh-pages-sync/showcase.html -Force
          Set-Location gh-pages-sync
          git add index.html showcase.html
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore(pages): sync the showcase mirror [skip ci]"
            git push origin gh-pages
          } else {
            Write-Output "gh-pages card is current"
          }

  # --------------------------------------------------------------------------- #
  # Nightly / manual — Docker-backed full stack + both eval harnesses.
  # --------------------------------------------------------------------------- #
  nightly:
    name: nightly full-stack + evals
    runs-on: [self-hosted, Windows, X64]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Mark the night's start
        run: |
          if (-not (Test-Path $env:RUNNER_TEMP)) { New-Item -ItemType Directory -Path $env:RUNNER_TEMP | Out-Null }
          (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ") > "$env:RUNNER_TEMP/night-start.txt"
      - name: Start infra (postgres / redis / minio)
        id: infra
        run: docker compose up -d postgres redis minio
      - name: Apply the schema (the Flyway migrations) to career_os
        id: schema
        run: |
          docker compose exec -T postgres psql -U career_os -d career_os -v ON_ERROR_STOP=1 -c "SELECT 1" || (docker compose restart postgres && Start-Sleep -Seconds 20 && docker compose exec -T postgres psql -U career_os -d career_os -c "SELECT 1")
          Get-ChildItem backend/src/main/resources/db/migration -Filter 'V*.sql' | Sort-Object Name | ForEach-Object { Write-Output "Applying $($_.Name)"; Get-Content $_.FullName | docker compose exec -T postgres psql -U career_os -d career_os -1 -v ON_ERROR_STOP=1 -q -f - }
      - name: Seed the jobs corpus
        id: seed-jobs
        run: docker compose run --rm seed-jobs
      - name: Backend integration tests (*IT)
        id: backend-it
        working-directory: backend
        env:
          CAREEROS_IT_PG_PASS: career_os_dev_password
        run: mvn -B test -Dtest='*IT'
      - name: ai-service install
        id: ai-install
        working-directory: ai-service
        env:
          DATABASE_URL: postgresql://career_os:career_os_dev_password@127.0.0.1:5432/career_os
          REDIS_URL: redis://127.0.0.1:16380/0
        run: |
          py -3.11 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Backfill job vectors
        id: vectors
        working-directory: ai-service
        env:
          DATABASE_URL: postgresql://career_os:career_os_dev_password@127.0.0.1:5432/career_os
          REDIS_URL: redis://127.0.0.1:16380/0
        run: .\.venv\Scripts\python.exe -m app.ops.embed_jobs --force
      - name: Build vector index (types column + HNSW)
        id: index
        run: Get-Content ai-service/ops/vector_index.sql | docker compose exec -T postgres psql -U career_os -d career_os -v ON_ERROR_STOP=1 -f -
      - name: Seed the eval corpus
        id: eval-corpus
        working-directory: ai-service
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: hash
          DATABASE_URL: postgresql://career_os:career_os_dev_password@127.0.0.1:5432/career_os
          REDIS_URL: redis://127.0.0.1:16380/0
        run: .\.venv\Scripts\python.exe -m app.ops.seed_eval_corpus --user-id 00000000-0000-0000-0000-000000000000 --corpus ../scripts/eval-corpus.json
      - name: RAG + agent eval harnesses
        id: eval
        working-directory: ai-service
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: hash
          DATABASE_URL: postgresql://career_os:career_os_dev_password@127.0.0.1:5432/career_os
          REDIS_URL: redis://127.0.0.1:16380/0
        run: .\.venv\Scripts\python.exe -m app.eval.run_eval --user-id 00000000-0000-0000-0000-000000000000 --answer
      - name: The portable export builds against the real schema
        id: export
        working-directory: ai-service
        env:
          DATABASE_URL: postgresql://career_os:career_os_dev_password@127.0.0.1:5432/career_os
          REDIS_URL: redis://127.0.0.1:16380/0
        run: .\.venv\Scripts\python.exe -m app.ops.check_export
      - name: Record the night in the deployment's history
        if: always()
        working-directory: ai-service
        env:
          OPS_URL: ${{ vars.CAREEROS_OPS_URL }}
          OPS_TOKEN: ${{ secrets.CAREEROS_INTERNAL_TOKEN }}
        run: |
          $startedAt = Get-Content $env:RUNNER_TEMP/night-start.txt
          $commit = "${{ github.sha }}"
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          .\.venv\Scripts\python.exe -m app.ops.nightly_report --started-at "$startedAt" --commit "$commit" --run-url "$runUrl" --eval-report-dir evals/reports --step "infra=${{ steps.infra.outcome }}" --step "schema=${{ steps.schema.outcome }}" --step "seed-jobs=${{ steps.seed-jobs.outcome }}" --step "backend-it=${{ steps.backend-it.outcome }}" --step "ai-install=${{ steps.ai-install.outcome }}" --step "vectors=${{ steps.vectors.outcome }}" --step "index=${{ steps.index.outcome }}" --step "eval-corpus=${{ steps.eval-corpus.outcome }}" --step "eval=${{ steps.eval.outcome }}" --step "export=${{ steps.export.outcome }}" --url "$env:OPS_URL" --token "$env:OPS_TOKEN"
      - name: Tear down infra
        if: always()
        run: docker compose down -v
