# Production docker-compose for AI Career OS
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d
#
# Prerequisites:
# - .env.prod file with production secrets (see .env.prod.example)
# - Reverse proxy (nginx/traefik) for TLS termination
# - DNS pointing to this host
#
# No `version:` key: it is obsolete in Compose v2 and the CLI warns about it on every
# command.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careeros-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: careeros-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  minio:
    # Same story as docker-compose.yml: MinIO pulled their images from the
    # registries in 2026-09; pgsty/silo is the repackaged RELEASE build.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: careeros-minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  ai-service:
    build: ./ai-service
    container_name: careeros-ai-prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BACKEND_BASE_URL: http://backend:8080
      APP_ENV: prod
    # Loopback only. ai-service is internal-only by design (README, docs/architecture.md,
    # docs/SECURITY.md) and the backend already reaches it as `ai-service:8000` over the
    # compose network, so it needs no host port at all. Publishing `8000:8000` put an
    # internal surface on every host interface; this keeps it reachable for local
    # debugging without exposing it.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  backend:
    build: ./backend
    container_name: careeros-backend-prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS}
      APP_ENV: prod
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      args:
        # Must be a build arg: the browser bundle inlines NEXT_PUBLIC_* at build time, so
        # a runtime `environment:` entry alone leaves the shipped app calling the dev
        # fallback (http://localhost:8080/api/v1) from every visitor's own machine.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: careeros-frontend-prod
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  pgdata:
  redisdata:
  miniodata: