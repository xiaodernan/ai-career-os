# Production docker-compose for AI Career OS
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod --profile app up -d
#
# `--env-file .env.prod` is not optional. The `env_file:` entries in the services below feed the
# containers, but compose expands every `${...}` before a container exists, from the process
# environment and the file `--env-file` names -- never from `env_file:`. And an `environment:`
# entry that carries an interpolation overrides the `env_file:` value, so without the flag a
# fresh host renders every required value as empty and those empties win. Each one below is
# spelled `${VAR:?message}`, which stops the command with the message instead.
#
# Prerequisites:
# - .env.prod file with production secrets (see .env.prod.example), passed with --env-file
# - Reverse proxy (nginx/traefik) for TLS termination
# - DNS pointing to this host
#
# No `version:` key: it is obsolete in Compose v2 and the CLI warns about it on every
# command.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careeros-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required -- fill .env.prod and pass --env-file .env.prod}
      POSTGRES_USER: ${POSTGRES_USER:?required -- fill .env.prod and pass --env-file .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required -- fill .env.prod and pass --env-file .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?required -- fill .env.prod and pass --env-file .env.prod} -d ${POSTGRES_DB:?required -- fill .env.prod and pass --env-file .env.prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: careeros-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?required -- fill .env.prod and pass --env-file .env.prod}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?required -- fill .env.prod and pass --env-file .env.prod}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  minio:
    # Same story as docker-compose.yml: MinIO pulled their images from the
    # registries in 2026-09; pgsty/silo is the repackaged RELEASE build.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: careeros-minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required -- fill .env.prod and pass --env-file .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required -- fill .env.prod and pass --env-file .env.prod}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  ai-service:
    build: ./ai-service
    container_name: careeros-ai-prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?required -- fill .env.prod and pass --env-file .env.prod}:${POSTGRES_PASSWORD:?required -- fill .env.prod and pass --env-file .env.prod}@postgres:5432/${POSTGRES_DB:?required -- fill .env.prod and pass --env-file .env.prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:?required -- fill .env.prod and pass --env-file .env.prod}@redis:6379/0
      BACKEND_BASE_URL: http://backend:8080
      APP_ENV: prod
    # Loopback only. ai-service is internal-only by design (README, docs/architecture.md,
    # docs/SECURITY.md) and the backend already reaches it as `ai-service:8000` over the
    # compose network, so it needs no host port at all. Publishing `8000:8000` put an
    # internal surface on every host interface; this keeps it reachable for local
    # debugging without exposing it.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  backend:
    build: ./backend
    container_name: careeros-backend-prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?required -- fill .env.prod and pass --env-file .env.prod}
      POSTGRES_USER: ${POSTGRES_USER:?required -- fill .env.prod and pass --env-file .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required -- fill .env.prod and pass --env-file .env.prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:?required -- fill .env.prod and pass --env-file .env.prod}@redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?required -- fill .env.prod and pass --env-file .env.prod}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required -- fill .env.prod and pass --env-file .env.prod}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:?required -- fill .env.prod and pass --env-file .env.prod}
      APP_ENV: prod
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      args:
        # Must be a build arg: the browser bundle inlines NEXT_PUBLIC_* at build time, so
        # a runtime `environment:` entry alone leaves the shipped app calling the dev
        # fallback (http://localhost:8080/api/v1) from every visitor's own machine.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?required -- fill .env.prod and pass --env-file .env.prod}
        # 33.4: the public half of the backend's own VAPID pair. Optional, because a
        # deployment may run without push at all; empty turns the settings switch off
        # rather than shipping a browser subscribed under a key nothing signs with.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${APP_PUSH_VAPID_PUBLIC_KEY:-}
    container_name: careeros-frontend-prod
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?required -- fill .env.prod and pass --env-file .env.prod}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${APP_PUSH_VAPID_PUBLIC_KEY:-}
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  pgdata:
  redisdata:
  miniodata: